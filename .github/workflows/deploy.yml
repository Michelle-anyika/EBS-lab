name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: eb-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Create source bundle
        run: zip -r bundle.zip . -x node_modules/** .git/** .github/** bundle.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload bundle to S3 and deploy to Elastic Beanstalk
        run: |
          set -euo pipefail

          APP_NAME="${{ secrets.EB_APP_NAME }}"
          ENV_NAME="${{ secrets.EB_ENV_NAME }}"
          S3_BUCKET="${{ secrets.S3_BUCKET }}"
          EXTERNAL_SERVICE_VALUE="${{ secrets.EXTERNAL_SERVICE }}"
          S3_BUCKET_NAME_VALUE="${{ secrets.S3_BUCKET_NAME }}"
          VERSION_LABEL="deploy-$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          S3_KEY="eb-deployments/${VERSION_LABEL}.zip"

          echo "Uploading application bundle to s3://${S3_BUCKET}/${S3_KEY}"
          aws s3 cp bundle.zip "s3://${S3_BUCKET}/${S3_KEY}"

          echo "Creating application version ${VERSION_LABEL}"
          aws elasticbeanstalk create-application-version \
            --application-name "$APP_NAME" \
            --version-label "$VERSION_LABEL" \
            --source-bundle S3Bucket="$S3_BUCKET",S3Key="$S3_KEY" \
            --auto-create-application

          # Environment variables are always driven from secrets here (never
          # from a value baked into the source bundle), so there is exactly
          # one source of truth and every deploy keeps them in sync.
          OPTION_SETTINGS=(
            Namespace=aws:elasticbeanstalk:application:environment,OptionName=EXTERNAL_SERVICE,Value="${EXTERNAL_SERVICE_VALUE}"
            Namespace=aws:elasticbeanstalk:application:environment,OptionName=S3_BUCKET_NAME,Value="${S3_BUCKET_NAME_VALUE}"
          )

          EXISTING_ENV=$(aws elasticbeanstalk describe-environments \
            --application-name "$APP_NAME" \
            --environment-names "$ENV_NAME" \
            --no-include-deleted \
            --query 'Environments | length(@)' \
            --output text)

          if [ "$EXISTING_ENV" -eq 0 ]; then
            echo "Resolving latest available Node.js 18 solution stack"
            SOLUTION_STACK=$(aws elasticbeanstalk list-available-solution-stacks \
              --query "SolutionStacks[?contains(@, 'running Node.js 18')] | [0]" \
              --output text)
            if [ -z "$SOLUTION_STACK" ] || [ "$SOLUTION_STACK" == "None" ]; then
              echo "::error::No available Elastic Beanstalk solution stack found for Node.js 18"
              exit 1
            fi
            echo "Using solution stack: ${SOLUTION_STACK}"

            echo "Creating Elastic Beanstalk environment $ENV_NAME"
            aws elasticbeanstalk create-environment \
              --application-name "$APP_NAME" \
              --environment-name "$ENV_NAME" \
              --solution-stack-name "$SOLUTION_STACK" \
              --version-label "$VERSION_LABEL" \
              --option-settings "${OPTION_SETTINGS[@]}" \
                Namespace=aws:elasticbeanstalk:environment,OptionName=ServiceRole,Value=aws-elasticbeanstalk-service-role
          else
            echo "Updating Elastic Beanstalk environment $ENV_NAME to version $VERSION_LABEL"
            aws elasticbeanstalk update-environment \
              --environment-name "$ENV_NAME" \
              --version-label "$VERSION_LABEL" \
              --option-settings "${OPTION_SETTINGS[@]}"
          fi

          echo "Waiting for environment to finish updating..."
          aws elasticbeanstalk wait environment-updated --environment-name "$ENV_NAME"

          HEALTH=$(aws elasticbeanstalk describe-environment-health \
            --environment-name "$ENV_NAME" \
            --attribute-names Status HealthStatus \
            --query 'HealthStatus' --output text)
          STATUS=$(aws elasticbeanstalk describe-environment-health \
            --environment-name "$ENV_NAME" \
            --attribute-names Status \
            --query 'Status' --output text)

          DEPLOYED_VERSION=$(aws elasticbeanstalk describe-environments \
            --environment-names "$ENV_NAME" \
            --query 'Environments[0].VersionLabel' --output text)

          echo "Environment status: ${STATUS}, health: ${HEALTH}, version: ${DEPLOYED_VERSION}"

          # "wait environment-updated" only waits for the environment to leave
          # Updating/Launching state - it returns just as successfully after a
          # failed deploy that rolled back to the old version. Checking status/
          # health alone would report success even though nothing new shipped,
          # so the version label is checked explicitly too.
          if [ "$STATUS" != "Ready" ] || { [ "$HEALTH" != "Ok" ] && [ "$HEALTH" != "Info" ]; }; then
            echo "::error::Deployment finished but environment is not healthy (status=${STATUS}, health=${HEALTH})"
            exit 1
          fi
          if [ "$DEPLOYED_VERSION" != "$VERSION_LABEL" ]; then
            echo "::error::Environment is healthy but running version '${DEPLOYED_VERSION}', expected '${VERSION_LABEL}' - deployment did not actually apply (likely rolled back)"
            exit 1
          fi

          # The environment's very first (console-created) configuration
          # explicitly recorded the default aws-elasticbeanstalk-ec2-role as
          # IamInstanceProfile. An explicitly-recorded environment option
          # takes precedence over the .ebextensions option_settings value on
          # every later deploy, so the Ref-based override in
          # iam-instance-role.config is silently ignored unless this option
          # is also set directly here. The profile's name is CloudFormation-
          # generated (kept nameless to avoid requiring CAPABILITY_NAMED_IAM,
          # which Elastic Beanstalk's environment update does not grant), so
          # it has to be resolved from the stack after each deploy rather
          # than hardcoded.
          ENV_ID=$(aws elasticbeanstalk describe-environments \
            --environment-names "$ENV_NAME" \
            --query 'Environments[0].EnvironmentId' --output text)
          STACK_NAME="awseb-${ENV_ID}-stack"
          INSTANCE_PROFILE_NAME=$(aws cloudformation describe-stack-resources \
            --stack-name "$STACK_NAME" \
            --logical-resource-id ExternalServiceInstanceProfile \
            --query 'StackResources[0].PhysicalResourceId' --output text 2>/dev/null || true)

          CURRENT_INSTANCE_PROFILE=$(aws elasticbeanstalk describe-configuration-settings \
            --application-name "$APP_NAME" --environment-name "$ENV_NAME" \
            --query "ConfigurationSettings[0].OptionSettings[?Namespace=='aws:autoscaling:launchconfiguration' && OptionName=='IamInstanceProfile'].Value | [0]" \
            --output text)

          if [ -n "$INSTANCE_PROFILE_NAME" ] && [ "$INSTANCE_PROFILE_NAME" != "None" ] && [ "$INSTANCE_PROFILE_NAME" != "$CURRENT_INSTANCE_PROFILE" ]; then
            echo "Correcting IamInstanceProfile: '${CURRENT_INSTANCE_PROFILE}' -> '${INSTANCE_PROFILE_NAME}'"
            aws elasticbeanstalk update-environment \
              --environment-name "$ENV_NAME" \
              --option-settings Namespace=aws:autoscaling:launchconfiguration,OptionName=IamInstanceProfile,Value="$INSTANCE_PROFILE_NAME"

            aws elasticbeanstalk wait environment-updated --environment-name "$ENV_NAME"

            HEALTH=$(aws elasticbeanstalk describe-environment-health \
              --environment-name "$ENV_NAME" --attribute-names HealthStatus --query 'HealthStatus' --output text)
            STATUS=$(aws elasticbeanstalk describe-environment-health \
              --environment-name "$ENV_NAME" --attribute-names Status --query 'Status' --output text)
            echo "Post-instance-profile-fix status: ${STATUS}, health: ${HEALTH}"
            if [ "$STATUS" != "Ready" ] || { [ "$HEALTH" != "Ok" ] && [ "$HEALTH" != "Info" ]; }; then
              echo "::error::Environment is not healthy after correcting IamInstanceProfile (status=${STATUS}, health=${HEALTH})"
              exit 1
            fi
          else
            echo "IamInstanceProfile already correct (${CURRENT_INSTANCE_PROFILE}), no follow-up update needed"
          fi
        shell: bash
